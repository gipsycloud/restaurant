version: '3.8'

services:
  app:
    image: postgres:16-alpine
    container_name: res
    ports:
      - "5432:5432"
    environment:
      - ENV_VAR=development
    volumes:
      - ./app:/usr/src/app
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_USER=postgres
      POSTGRES_PASSWORD=mandalay
      POSTGRES_DB=res_development
    volumes:
      - db_data:/var/lib/postgresql/data